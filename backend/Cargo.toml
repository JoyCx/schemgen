[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
schemgen-core = { path = "crates/core" }
schemgen-server = { path = "crates/server" }

actix-web = "4"
actix-files = "0.6"
actix-multipart = "0.7"
base64 = "0.22"
env_logger = "0.11"
flate2 = "1"
# glTF 2.0 parsing only: buffers and images are read by schemgen-core itself,
# so only the textures a conversion uses get decoded.
gltf = { version = "1.4", default-features = false, features = [
    "utils",
    "names",
    "extensions",
    "KHR_texture_transform",
    "KHR_materials_pbrSpecularGlossiness",
    "KHR_materials_emissive_strength",
    "KHR_materials_unlit",
    "allow_empty_texture",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kiddo = "5"
log = "0.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
