org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Configure only the projects a task needs. The Fabric projects cannot even be
# configured without Fabric's and Mojang's servers (Loom sets up Minecraft
# while configuring), and `:common:test` must not depend on them.
org.gradle.configureondemand=true

mod_id=schemgen
mod_version=0.1.0
maven_group=io.github.joycx.schemgen

# The schemgen2 server release this mod launches and was tested against — the
# `[workspace.package] version` of backend/Cargo.toml. The sidecar binary is
# fetched (or bundled) for exactly this version.
schemgen_server_version=2.1.0

# Shared across Minecraft versions; the rest is in fabric/versions/*/gradle.properties.
loader_version=0.18.4
