name: Probe Modrinth (temporary)

# One-off diagnostic: which Litematica and MaLiLib builds Modrinth's Maven
# serves for each Minecraft version the mod targets. Removed once read.
on:
  push:
    paths:
      - '.github/workflows/probe-modrinth.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions per Minecraft version
        run: |
          for mc in 1.21.1 1.21.4 1.21.8 1.21.11; do
            for project in litematica malilib; do
              echo "== $project for $mc (fabric)"
              curl -fsS "https://api.modrinth.com/v2/project/$project/version?game_versions=%5B%22$mc%22%5D&loaders=%5B%22fabric%22%5D" \
                | jq -r '.[] | [.version_number, .id, .status, .version_type, .date_published[0:10], (.game_versions | join(",")), .files[0].filename] | @tsv'
            done
          done
      - name: Maven coordinates
        run: |
          for coord in litematica/0.19.58 litematica/0.21.3 litematica/0.21.7 litematica/0.23.4 litematica/DF02w8iL \
                       litematica/0.23.6 litematica/0.23.7 litematica/0.26.3 litematica/ZF7nARQU litematica/0.26.11 \
                       litematica/0.26.13 malilib/0.21.8 malilib/0.23.3 malilib/0.25.4 malilib/USRMpjDG malilib/0.25.7 \
                       malilib/0.27.7 malilib/5Ywu5uMw malilib/0.27.9 malilib/0.27.10; do
            name=${coord%%/*}; v=${coord##*/}
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.modrinth.com/maven/maven/modrinth/$name/$v/$name-$v.pom")
            echo "$coord -> $code"
          done
