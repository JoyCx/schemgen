name: Probe mod jars (temporary)

# One-off diagnostic: which Loom version built each jar the mod compiles
# against for 1.21.8 and 1.21.11. Removed once read.
on:
  push:
    paths:
      - '.github/workflows/probe-modrinth.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Loom versions in the manifests
        run: |
          show() {
            curl -fsSL -o jar.jar "$1" || { echo "$1 -> download failed"; return; }
            printf '%s\n' "$1"
            unzip -p jar.jar META-INF/MANIFEST.MF | grep -E '^(Fabric-Loom-Version|Fabric-Loom-Mixin-Remap-Type|Fabric-Loom-Remap|Fabric-Minecraft-Version):' | sed 's/^/    /'
          }
          M=https://api.modrinth.com/maven/maven/modrinth
          F=https://maven.fabricmc.net/net/fabricmc
          for v in 0.19.58 0.21.3 0.23.7 0.26.11 0.26.16; do show "$M/litematica/$v/litematica-$v.jar"; done
          for v in 0.21.8 0.23.3 0.25.4 0.25.7 0.27.10 0.27.16 0.27.20; do show "$M/malilib/$v/malilib-$v.jar"; done
          for v in 0.116.17+1.21.1 0.119.4+1.21.4 0.136.1+1.21.8 0.141.6+1.21.11; do show "$F/fabric-api/fabric-api/$v/fabric-api-$v.jar"; done
          show "$F/fabric-loader/0.18.4/fabric-loader-0.18.4.jar"
          echo "Litematica 1.21.8 builds (all statuses):"
          curl -fsS "https://api.modrinth.com/v2/project/litematica/version?game_versions=%5B%221.21.8%22%5D&include_changelog=false" \
            | jq -r '.[] | [.version_number, .status, .date_published[0:10]] | @tsv'
