# SchemGen2 Fabric mod — build coordinates.
#
# Every version here was read from the authoritative source, not guessed:
#   minecraft/data version  https://mcreference.com/minecraft-versions/1.21.11 (1.21.11, data version 4671)
#   yarn_mappings           https://meta.fabricmc.net/v2/versions/yarn/1.21.11
#   loader_version          https://meta.fabricmc.net/v2/versions/loader/1.21.11
#   fabric_version          https://api.modrinth.com/v2/project/fabric-api/version?game_versions=["1.21.11"]
#
# To retarget another Minecraft version, refresh all four from those URLs
# together — mismatched yarn/loader pairs fail with confusing mapping errors.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

mod_version=2.0.0
maven_group=com.schemgen
archives_base_name=schemgen2-fabric
