plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the Minecraft and Fabric repositories itself. The mod has no
    // third-party dependencies on purpose: everything it needs — an HTTP client
    // (java.net.http), a JSON parser (Gson, shipped with Minecraft) and a file
    // dialog (LWJGL's TinyFileDialogs, shipped with Minecraft) — is already on
    // the classpath, so the jar stays a few dozen KB and needs no shading.
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
    }
}

// Minecraft 1.21.11 runs on Java 21. A newer JDK compiles the mod fine as long
// as it targets 21 — that is what `options.release` pins, without demanding a
// separate JDK 21 toolchain install.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
